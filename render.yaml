# render.yaml — Infrastructure-as-Code blueprint for Render
# https://docs.render.com/blueprint-spec
#
# SINGLE SERVICE: Frontend + Backend in one container

services:
  - type: web
    name: nrtf
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false       # set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_TLS_ENABLED
        value: "true"
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_CA_CERT
        sync: false
